name: Model Training & Verification Pipeline

on:
  workflow_dispatch:
    inputs:
      samples:
        description: 'Number of sample images for model evaluation'
        required: false
        default: '1000'
  schedule:
    - cron: '0 2 * * 0'  # Weekly Sunday run at 02:00 UTC

permissions:
  contents: read

jobs:
  train_and_evaluate:
    name: Multi-Architecture Model Training
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Execute Model Training Pipeline
        env:
          PYTHONPATH: .
        run: |
          python src/models/train_and_evaluate.py --samples ${{ github.event.inputs.samples || 500 }}
          python src/models/generate_plots.py

      - name: Verify Generated Benchmark Results
        run: |
          python -c "
          import pandas as pd
          for path in ['reports/benchmarks/production_benchmark.csv', 'reports/benchmarks/ci_smoke_test_benchmark.csv']:
              try:
                  df = pd.read_csv(path)
                  print(f'Successfully validated {path} with {len(df)} configurations')
                  break
              except FileNotFoundError:
                  continue
          "

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: reports/benchmarks/*.csv

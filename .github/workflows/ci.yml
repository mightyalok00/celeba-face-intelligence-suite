name: CI & Code Quality Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      samples:
        description: Number of samples for the training smoke test (200–499)
        type: number
        default: 200
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  lint_and_security:
    name: Lint, Types & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Static Analysis Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit types-PyYAML

      - name: Ruff Linter
        run: |
          ruff check app/ src/ scripts/ tests/

      - name: MyPy Static Typing
        run: |
          mypy src app main.py tests/unit/ --ignore-missing-imports

      - name: Bandit Security Scan
        run: |
          bandit -r app/ src/ -ll -x tests,data,img_align_celeba

  test_coverage:
    name: Unit & Integration Tests (Coverage >= 85%)
    runs-on: ubuntu-latest
    needs: [lint_and_security]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test_pass
          MYSQL_DATABASE: celeba_db
          MYSQL_USER: celeba_user
          MYSQL_PASSWORD: celeba_pass_2026
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run Test Suite with Strict 85% Coverage Threshold
        env:
          CI: "true"
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: celeba_user
          MYSQL_PASSWORD: celeba_pass_2026
          MYSQL_DATABASE: celeba_db
        run: |
          python -m pytest tests/unit/ tests/security/ tests/integration/ tests/end_to_end/ \
            -v --cov=src --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml

  node_build:
    name: TypeScript Server Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'

      - name: Install JavaScript Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and Build
        run: bun run build

  train_and_evaluate:
    name: Multi-Architecture Training Smoke Test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Generate and verify smoke benchmark
        env:
          PYTHONPATH: .
          SMOKE_SAMPLES: ${{ inputs.samples || 200 }}
        run: |
          if ! [[ "$SMOKE_SAMPLES" =~ ^[0-9]{3}$ ]] || (( 10#$SMOKE_SAMPLES < 200 || 10#$SMOKE_SAMPLES > 499 )); then
            echo "::error::Smoke test samples must be an integer between 200 and 499."
            exit 1
          fi
          benchmark=reports/benchmarks/ci_smoke_test_benchmark.csv
          rm -f "$benchmark"
          python src/models/train_and_evaluate.py --samples "$SMOKE_SAMPLES"
          python -c 'import pandas as pd; import sys; assert not pd.read_csv(sys.argv[1]).empty' "$benchmark"

      - name: Upload Smoke Benchmark
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-artifacts
          path: reports/benchmarks/ci_smoke_test_benchmark.csv
          if-no-files-found: error

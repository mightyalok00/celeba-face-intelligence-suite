[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "celeba-face-intelligence-suite"
version = "2.5.0"
description = "Production-grade facial attribute analytics, multi-architecture deep learning benchmarks, and MCP JSON-RPC intelligence suite."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Alok Agarwal"}
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [
    "img_align_celeba",
    "Celebrity-Face-Recognition-Dataset-master",
    "data",
    ".git",
    ".gemini",
    "node_modules",
    ".pytest_cache",
    "__pycache__"
]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "img_align_celeba",
    "data",
    ".git",
    ".venv",
    "node_modules"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "img_align_celeba",
    "data",
    "node_modules"
]

[tool.bandit]
exclude_dirs = ["tests", "data", "img_align_celeba"]
skips = ["B101", "B311"]

[tool.pyright]
include = ["app", "src", "workflow", "tests"]
exclude = ["img_align_celeba", "data", ".git"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

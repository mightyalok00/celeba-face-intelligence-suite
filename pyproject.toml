[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "celeba-face-intelligence-suite"
version = "2.5.0"
description = "Production-grade facial attribute analytics, multi-architecture deep learning benchmarks, and MCP JSON-RPC intelligence suite."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Alok Agarwal"}
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [
    "img_align_celeba",
    "Celebrity-Face-Recognition-Dataset-master",
    "data",
    ".git",
    ".gemini",
    "node_modules",
    ".pytest_cache",
    "__pycache__"
]
addopts = "-v --strict-markers"
markers = ["live_mysql: uses the configured MySQL service"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "img_align_celeba",
    "data",
    ".git",
    ".venv",
    "node_modules"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "img_align_celeba",
    "data",
    "node_modules"
]

[tool.bandit]
exclude_dirs = ["tests", "data", "img_align_celeba"]
skips = ["B101", "B311"]

[tool.pyright]
include = ["app", "src", "tests", "scripts"]
exclude = ["img_align_celeba", "data", ".git"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pyrefly]
search_path = [".", "src", "app", "tests", "scripts"]
strict = false

[tool.pyrefly.errors]
missing-source-for-stubs = "ignore"
missing-import = "ignore"
unnecessary-type-conversion = "ignore"
bad-index = "ignore"
untyped-import = "ignore"
unused-import = "ignore"
unused-variable = "ignore"
implicit-any = "ignore"
missing-attribute = "ignore"
bad-argument-type = "ignore"
bad-assignment = "ignore"
unsupported-operation = "ignore"
not-iterable = "ignore"
bad-argument-count = "ignore"

[tool.coverage.run]
source = ["src", "app"]
omit = [
    "app/app.py",
    "app/ui/*",
    "tests/*",
    "img_align_celeba/*",
    "data/*"
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except ImportError:",
    "def __repr__"
]
